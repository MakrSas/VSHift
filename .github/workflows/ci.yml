name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: Host build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVSHIFT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  ios-simulator:
    name: iOS simulator compile
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify RPCS3 submodule
        shell: bash
        run: |
          test -f third_party/rpcs3/CMakeLists.txt
          git -C third_party/rpcs3 rev-parse HEAD
      - name: Configure Xcode project
        run: >-
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DVSHIFT_BUILD_IOS=ON
          -DVSHIFT_BUILD_RPCS3_CORE=ON
          -DVSHIFT_RPCS3_WITH_VULKAN=OFF
          -DVSHIFT_BUILD_TESTS=OFF
      - name: Build unsigned simulator app
        run: >-
          cmake --build build-ios --config Release
          --target vshift_ios_jit_probe
          --
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Verify simulator bundle
        shell: bash
        run: test -d build-ios/Release-iphonesimulator/vshift_ios_jit_probe.app
      - name: Upload simulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: vshift-ios-simulator
          path: build-ios/Release-iphonesimulator/vshift_ios_jit_probe.app
      - name: Collect simulator diagnostics
        if: always()
        shell: bash
        run: |
          git submodule status --recursive > simulator-submodules.txt
          xcodebuild -version > simulator-xcode-version.txt 2>&1 || true
      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vshift-ios-simulator-diagnostics
          path: |
            simulator-submodules.txt
            simulator-xcode-version.txt

  ios-device-unsigned:
    name: iOS device unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify RPCS3 submodule
        shell: bash
        run: |
          test -f third_party/rpcs3/CMakeLists.txt
          git -C third_party/rpcs3 rev-parse HEAD
      - name: Configure device project
        run: >-
          cmake -S . -B build-device -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DVSHIFT_BUILD_IOS=ON
          -DVSHIFT_BUILD_RPCS3_CORE=ON
          -DVSHIFT_RPCS3_WITH_VULKAN=OFF
          -DVSHIFT_BUILD_TESTS=OFF
      - name: Build unsigned device app
        run: >-
          cmake --build build-device --config Release
          --target vshift_ios_jit_probe
          --
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        shell: bash
        run: |
          test -d build-device/Release-iphoneos/vshift_ios_jit_probe.app
          mkdir -p ipa/Payload
          cp -R build-device/Release-iphoneos/vshift_ios_jit_probe.app ipa/Payload/VSHiftJITProbe.app
          (cd ipa && zip -qry ../VSHiftJITProbe-unsigned.ipa Payload)
          test -s VSHiftJITProbe-unsigned.ipa
      - name: Upload device IPA
        uses: actions/upload-artifact@v4
        with:
          name: vshift-ios-device-unsigned-ipa
          path: VSHiftJITProbe-unsigned.ipa
      - name: Collect device diagnostics
        if: always()
        shell: bash
        run: |
          git submodule status --recursive > device-submodules.txt
          xcodebuild -version > device-xcode-version.txt 2>&1 || true
      - name: Upload device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vshift-ios-device-diagnostics
          path: |
            device-submodules.txt
            device-xcode-version.txt
