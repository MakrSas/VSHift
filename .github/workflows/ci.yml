name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: Host build and tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVSHIFT_BUILD_TESTS=ON -DVSHIFT_BUILD_PS3=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  ios-simulator:
    name: iOS simulator compile
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Xcode project
        run: >-
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DVSHIFT_BUILD_IOS=ON
          -DVSHIFT_BUILD_TESTS=OFF
      - name: Build unsigned simulator app
        run: >-
          cmake --build build-ios --config Release
          --target vshift_ios_jit_probe
          --
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Upload simulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: vshift-ios-simulator
          path: build-ios/Release-iphonesimulator/vshift_ios_jit_probe.app

  ios-device-unsigned:
    name: iOS device unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore iOS device build cache
        uses: actions/cache@v4
        with:
          path: build-device
          key: ios-device-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'app/ios/**', 'core/**', '.gitmodules') }}
          restore-keys: |
            ios-device-${{ runner.os }}-
      - name: Configure device project
        run: >-
          cmake -S . -B build-device -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DVSHIFT_BUILD_IOS=ON
          -DVSHIFT_BUILD_TESTS=OFF
      - name: Build unsigned device app
        run: >-
          cmake --build build-device --config Release
          --target vshift_ios_jit_probe
          --
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build-device/Release-iphoneos/vshift_ios_jit_probe.app ipa/Payload/VSHiftJITProbe.app
          (cd ipa && zip -qry ../VSHiftJITProbe-unsigned.ipa Payload)
      - name: Upload device IPA
        uses: actions/upload-artifact@v4
        with:
          name: vshift-ios-device-unsigned-ipa
          path: VSHiftJITProbe-unsigned.ipa
